[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmscribe"
dynamic = ["version"]
description = "Deterministic project extractor and structured code-access tool for local projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Amrito Kundu" }]
keywords = ["cli", "llm", "codebase", "developer-tools", "context", "code-export", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
# Runtime: every entry is imported by the package.
dependencies = [
    "mcp>=1.9,<3",       # MCP server (llmscribe.mcp)
    "pydantic>=2.0",     # tool parameter schemas (llmscribe.mcp.tools)
    "pathspec>=0.11",    # gitignore semantics (llmscribe.core.tree_builder)
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/AMRITO-KUNDU/llmscribe"
Repository = "https://github.com/AMRITO-KUNDU/llmscribe"
Issues = "https://github.com/AMRITO-KUNDU/llmscribe/issues"

[project.scripts]
llmscribe = "llmscribe.cli.main:main"
llmscribe-gui = "llmscribe.gui.app:main"
llmscribe-mcp = "llmscribe.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Single version source: src/llmscribe/__init__.py
version = { attr = "llmscribe.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

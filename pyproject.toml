[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmscribe"
dynamic = ["version"]
description = "Export a project folder into a single, LLM-ready text file — directory tree plus full file contents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Amrito Kundu" }]
keywords = [
    "cli",
    "llm",
    "codebase",
    "developer-tools",
    "context",
    "prompt-engineering",
    "code-export",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AMRITO-KUNDU/LLMScribe"
Repository = "https://github.com/AMRITO-KUNDU/LLMScribe"
Issues = "https://github.com/AMRITO-KUNDU/LLMScribe/issues"

[project.scripts]
llmscribe = "llmscribe.cli.main:main"
llmscribe-gui = "llmscribe.gui.app:main"
llmscribe-cui = "llmscribe.cui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "llmscribe.__version__" }

[tool.setuptools.package-data]
llmscribe = ["py.typed"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmscribe"
dynamic = ["version"]
description = "A filesystem layer for AI agents: read, search and change a codebase, identical on every OS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Amrito Kundu" }]
keywords = ["cli", "llm", "codebase", "developer-tools", "context", "code-export", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
# Core has exactly one dependency, so a framework can embed it without dragging in
# an MCP server. `mcp` alone pulls 155 transitive packages; nothing in core, the CLI
# or the Python API touches it. Install llmscribe[server] for the MCP server.
dependencies = [
    "pathspec>=0.11",    # gitignore semantics (llmscribe.core.tree_builder)
]

[project.optional-dependencies]
server = [
    "mcp>=1.9,<3",       # MCP server (llmscribe.mcp)
    "pydantic>=2.0",     # tool parameter schemas (llmscribe.mcp.tools)
]
all = [
    "llmscribe[server]",
]
# Agent-framework adapters. Each is optional: importing llmscribe never needs one.
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.11"]
pydantic-ai = ["pydantic-ai>=0.0.20"]
smolagents = ["smolagents>=1.0"]
adapters = [
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
    "pydantic-ai>=0.0.20",
    "smolagents>=1.0",
]
gui = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]
dev = [
    "llmscribe[server]",  # tests cover the MCP surface too
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/AMRITO-KUNDU/llmscribe"
Repository = "https://github.com/AMRITO-KUNDU/llmscribe"
Issues = "https://github.com/AMRITO-KUNDU/llmscribe/issues"

[project.scripts]
llmscribe = "llmscribe.cli.main:main"
llmscribe-gui = "llmscribe.gui.app:main"
llmscribe-mcp = "llmscribe.mcp_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Single version source: src/llmscribe/__init__.py
version = { attr = "llmscribe.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

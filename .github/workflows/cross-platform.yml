name: Cross-platform output

# Proves the central claim: the same command returns the same bytes on Linux, macOS
# and Windows. scripts/cross_platform_check.py builds an identical fixture, runs the
# read-only operations over it and digests the result; this job runs that on all
# three and fails if the digests differ.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    name: digest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compute output digest
        run: python scripts/cross_platform_check.py --out "digest-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt
          if-no-files-found: error

  compare:
    name: compare operating systems
    needs: digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          merge-multiple: true

      - name: Fail if the operating systems disagree
        run: |
          set -eu
          ls -l digests
          reference=$(ls digests/*.txt | head -1)
          echo "reference: $reference"
          status=0
          for file in digests/*.txt; do
            [ "$file" = "$reference" ] && continue
            if ! diff -u "$reference" "$file"; then
              echo "::error file=$file::$file differs from $reference"
              status=1
            fi
          done
          echo
          echo "--- digest (identical on every OS) ---"
          cat "$reference"
          exit $status

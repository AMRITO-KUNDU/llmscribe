name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "server.json pinned to $VERSION"

      - name: Wait for the version to be live on PyPI
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          echo "waiting for llmscribe ${VERSION} on PyPI..."
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/llmscribe/${VERSION}/json" >/dev/null; then
              echo "llmscribe ${VERSION} is live on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "timed out waiting for llmscribe ${VERSION} on PyPI" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

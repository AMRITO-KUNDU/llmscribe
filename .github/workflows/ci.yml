name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Version sync
        if: matrix.python-version == '3.12'
        run: python scripts/sync_version.py --check
      - name: Test
        run: python -m pytest

  # The suite has Windows-specific code in it - winerror mapping, path-length limits,
  # chmod semantics - and none of it is exercised by a Linux runner. One job on one
  # Python version is enough to catch a broken Windows assumption.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the core wheel (no MCP server)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/llmscribe version
          /tmp/smoke/bin/llmscribe --help
          /tmp/smoke/bin/python -m llmscribe version
          test -x /tmp/smoke/bin/llmscribe-mcp
          # The core install must not pull the MCP server's 155-package tree.
          /tmp/smoke/bin/python -c "import sys, llmscribe; from llmscribe import Repository, tool_schemas; assert 'mcp' not in sys.modules, 'mcp leaked into core'; assert 'pydantic' not in sys.modules, 'pydantic leaked into core'; assert len(tool_schemas('openai'))==12; print('core-only install ok')"
          # Without the extra it must explain itself, not traceback.
          /tmp/smoke/bin/llmscribe-mcp 2>&1 | grep -q "llmscribe\[server\]"

      - name: Smoke-test the server extra
        run: |
          WHEEL=$(ls /home/runner/work/*/*/dist/*.whl 2>/dev/null || ls dist/*.whl)
          /tmp/smoke/bin/pip install "${WHEEL}[server]"
          cd /tmp
          /tmp/smoke/bin/python -c "import llmscribe.mcp as m, asyncio; names=sorted(t.name for t in asyncio.run(m.mcp.list_tools())); print(names); assert len(names)==12"
          /tmp/smoke/bin/python -c "import llmscribe.mcp.tools; print('server extra ok')"

  adapters:
    name: adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Without this job the adapter tests skip silently via importorskip, so a
      # framework changing its API would break users while CI stayed green.
      - name: Install with every adapter
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,adapters]"

      - name: Adapter tests must actually run, not skip
        run: python -m pytest tests/test_layer.py -q -rs

      - name: Fail if an adapter test skipped
        run: |
          python -m pytest tests/test_layer.py -q -rs | tee /tmp/adapters.log
          if grep -q "SKIPPED" /tmp/adapters.log; then
            echo "::error::An adapter test skipped, so it is not covered"
            exit 1
          fi

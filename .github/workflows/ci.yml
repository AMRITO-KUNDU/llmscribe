name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Test
        run: python -m pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/llmscribe version
          /tmp/smoke/bin/llmscribe --help
          /tmp/smoke/bin/python -m llmscribe version
          /tmp/smoke/bin/python -c "import llmscribe.mcp as m, asyncio; names=sorted(t.name for t in asyncio.run(m.mcp.list_tools())); print(names); assert len(names)==7"
          test -x /tmp/smoke/bin/llmscribe-mcp
